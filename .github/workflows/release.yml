name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag is only released if the same tests as CI pass on that commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: test
        env:
          AG_RUN_DOCKER_PARITY: "1"
        run: go test -race ./... -count=1 -p 4

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write     # publish the release
      id-token: write     # keyless signing for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed build provenance for every archive: proves an artifact was
      # built by this workflow from this commit. Check a download with
      #   gh attestation verify <file> -R muhammadusamahoyrr/actiongate
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
