name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: gofmt is clean
        run: test -z "$(gofmt -l .)"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned: "latest" picked up new checks between a local run and CI.
          version: v2.12.2

      # Known vulnerabilities reachable from the shipped binaries (stdlib +
      # deps). Scoped to cmd/ so test-only helpers (testcontainers) don't count.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./cmd/...

      # Testcontainers uses the runner's Docker daemon; the transition suite
      # runs against real postgres:18-alpine, never mocks. The embedded-Postgres
      # packages (dbruntime, health) exercise the SAME PG18 as the bundled
      # runtime, so both deployment modes are covered here.
      # -p 4 bounds simultaneous packages: each integration package runs its
      # own Postgres container.
      # AG_RUN_DOCKER_PARITY enables the byte-identical verify parity check
      # (docker vs embedded) — it needs the Docker daemon, present on CI.
      - name: test (race + coverage)
        env:
          AG_RUN_DOCKER_PARITY: "1"
        run: go test -race ./... -count=1 -p 4 -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -5

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf generate compiles
        run: buf generate

  # The product ships for Windows and macOS (and the author develops on
  # Windows), so build, lint and test there too. These runners have no
  # Linux container daemon: the Postgres-container suites are skipped here
  # and run in the Linux job above. Embedded-Postgres tests (dbruntime,
  # health, controlplane, dbroles) do run, and are slow, hence the timeout.
  portable:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2

      - name: test
        shell: bash
        env:
          AG_SKIP_DOCKER_TESTS: "1"
        run: go test ./... -count=1 -p 2 -timeout 40m
