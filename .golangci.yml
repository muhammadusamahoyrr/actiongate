version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
  exclusions:
    paths:
      - gen
      - internal/db/dbgen

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - gen
      - internal/db/dbgen
